# Bluetooth 5 LE peripheral at the nRF52840's maximum supported TX power.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PeloPower"
CONFIG_BT_DEVICE_APPEARANCE=1156
CONFIG_BT_MAX_CONN=2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Keep the identity stable so a Garmin does not need to rediscover it after every reboot.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Device Information Service, useful to collectors during service discovery.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="nRF52840 USB"
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="PeloPower"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="1.0.0"

# Native USB CDC ACM transport used by the Android UsbManager host API.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="PeloPower"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="PeloPower USB BLE"
# Private prototype identity. Allocate a project VID/PID before public distribution.
CONFIG_CDC_ACM_SERIAL_VID=0x1915
CONFIG_CDC_ACM_SERIAL_PID=0x521F
CONFIG_CDC_ACM_SERIAL_MAX_POWER=50

# No console or logging is mixed into the binary metric stream.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=3072
